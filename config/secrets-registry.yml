---
# Secrets registry — metadata only (no passwords, no tokens).
# Machine-specific values: group_vars/work.local.yml (gitignored) + Memex work.local.yml.
# Verify: make secrets-check   Setup helpers: make secrets-help

version: 1

keychain_items:
  notion_mcp:
    service: claude-mcp-notion
    account: claude-code
    label: claude-mcp-notion
    make_target: secrets-notion
    docs: docs/secrets-keychain.md
    notes: >-
      Notion Internal Integration Token for the Notion MCP server.
      Read at runtime by ~/.mcp/wrappers/notion.sh; never stored in config files.

  linear_mcp:
    service: claude-mcp-linear
    account: claude-code
    label: claude-mcp-linear
    make_target: secrets-linear
    docs: docs/secrets-keychain.md
    notes: >-
      Linear Personal API Key for the Linear MCP server (team: SpecterRealm).
      Read at runtime by ~/.mcp/wrappers/linear.sh; never stored in config files.

  atlassian_mcp_jira:
    service: claude-mcp-atlassian-jira
    account: claude-code
    label: claude-mcp-atlassian-jira
    make_target: secrets-atlassian
    docs: docs/secrets-keychain.md
    notes: >-
      Jira Personal API Token for the Atlassian MCP server.
      Read at runtime by ~/.mcp/wrappers/atlassian.sh; never stored in config files.

  atlassian_mcp_confluence:
    service: claude-mcp-atlassian-confluence
    account: claude-code
    label: claude-mcp-atlassian-confluence
    make_target: secrets-atlassian
    docs: docs/secrets-keychain.md
    notes: >-
      Confluence Personal API Token for the Atlassian MCP server.
      Read at runtime by ~/.mcp/wrappers/atlassian.sh; never stored in config files.

runtime_env:
  klam_artifactory_api_key:
    var: KLAM_ARTIFACTORY_API_KEY
    purpose: KLAM pip install from Artifactory
    never_commit: true
    docs: docs/work/klam.md

local_files:
  atlassian_mcp_config:
    path: ~/.mcp/env/atlassian-config.env
    template: dotfiles/dot_mcp/env/atlassian.env.example
    purpose: Atlassian MCP non-secret config (URLs, usernames — no tokens)
    never_commit: false
    make_target: secrets-atlassian
    docs: docs/secrets-keychain.md

# Planned — employer 1Password (not implemented yet)
planned_onepassword:
  status: future
  docs: docs/secrets-keychain.md#planned-1password-employer
  notes: >-
    Employer org 1Password rollout TBD. Extend to KLAM, Atlassian MCP, and
    make secrets-1p-* helpers when op CLI is standard on work Macs.

  klam_artifactory_api_key:
    today: KLAM_ARTIFACTORY_API_KEY env at apply time
    future: op:// item or op run wrapper; optional make secrets-1p-klam

  atlassian_mcp:
    today: tokens in Keychain (claude-mcp-atlassian-jira/confluence); config in ~/.mcp/env/atlassian-config.env
    future: op inject or op run wrapper for tokens; document op:// paths in Memex only
