---
# Personal profile — home-tagged tasks (see docs/tags.md).

- name: Show AWS config (dry-run)
  ansible.builtin.debug:
    msg: >-
      Would write managed ~/.aws/config with [profile {{ personal_aws_profile }}]
      and [profile cvmtb] (region/output only; credentials stay in ~/.aws/credentials).
  when:
    - dry_run | default(false) | bool
    - "'home' in workstation_tags"
  tags:
    - home

- name: Ensure ~/.aws exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.aws"
    state: directory
    mode: "0700"
  when:
    - not (dry_run | default(false) | bool)
    - "'home' in workstation_tags"
  tags:
    - home

# Own the whole file so re-apply heals orphans from `aws configure` or broken blockinfile markers.
- name: Write managed AWS config profiles
  ansible.builtin.template:
    src: aws_config.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.aws/config"
    mode: "0600"
  when:
    - not (dry_run | default(false) | bool)
    - "'home' in workstation_tags"
  tags:
    - home

- name: Mark personal profile role applied
  ansible.builtin.set_fact:
    workstation_personal_role_applied: true
  tags:
    - home
