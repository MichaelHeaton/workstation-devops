---
# Install vl (adobe-security-tooling/vaultlogin) and deploy per-cluster
# shell aliases (vault_login/vault_mgmt come from the same onboarding wiki
# lineage, but auth itself is OIDC via the vl binary, not a hand-rolled
# Okta shell function).

- name: Vault tools role
  when: vault_tools_enabled | default(true) | bool
  tags:
    - work
  block:
    - name: Ensure workstation-devops config directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/workstation-devops"
        state: directory
        mode: "0755"
      when: not (dry_run | default(false) | bool)

    - name: Ensure vaultlogin install directory exists
      ansible.builtin.file:
        path: "{{ vaultlogin_install_dir }}"
        state: directory
        mode: "0755"
      when: not (dry_run | default(false) | bool)

    - name: Probe installed vl version
      ansible.builtin.command:
        argv:
          - "{{ vaultlogin_install_dir }}/vl"
          - --version
      register: vaultlogin_version_probe
      changed_when: false
      failed_when: false
      when: not (dry_run | default(false) | bool)

    - name: Set vl install requirement
      ansible.builtin.set_fact:
        vaultlogin_install_needed: >-
          {{
            (vaultlogin_version_probe.rc | default(1)) != 0
            or (('v' ~ vaultlogin_version) not in (vaultlogin_version_probe.stdout | default('')))
          }}
      when: not (dry_run | default(false) | bool)

    - name: Assume vl install needed for dry-run preview
      ansible.builtin.set_fact:
        vaultlogin_install_needed: true
      when: dry_run | default(false) | bool

    - name: Show vl install plan (dry-run)
      ansible.builtin.debug:
        msg: >-
          Would install vl v{{ vaultlogin_version }} from
          https://github.com/{{ vaultlogin_github_repo }}/releases/download/v{{ vaultlogin_version }}/vl-v{{ vaultlogin_version }}-darwin-arm64.tar.gz
          → {{ vaultlogin_install_dir }}/vl (via gh release download — private repo).
      when:
        - dry_run | default(false) | bool
        - vaultlogin_install_needed | default(true) | bool

    - name: Skip vl download — correct version already installed
      ansible.builtin.debug:
        msg: "vl v{{ vaultlogin_version }} already installed at {{ vaultlogin_install_dir }}/vl"
      when:
        - not (dry_run | default(false) | bool)
        - not (vaultlogin_install_needed | default(true) | bool)

    - name: Download vl release asset via gh
      ansible.builtin.command:
        argv:
          - gh
          - release
          - download
          - "v{{ vaultlogin_version }}"
          - --repo
          - "{{ vaultlogin_github_repo }}"
          - --pattern
          - "*-darwin-arm64.tar.gz"
          - --dir
          - /tmp
          - --clobber
      changed_when: true
      when:
        - not (dry_run | default(false) | bool)
        - vaultlogin_install_needed | default(true) | bool

    - name: Install vl binary from downloaded tarball
      ansible.builtin.shell: |
        set -euo pipefail
        tarball="/tmp/vl-v{{ vaultlogin_version }}-darwin-arm64.tar.gz"
        extract="/tmp/vl-v{{ vaultlogin_version }}-extract"
        rm -rf "$extract"
        mkdir -p "$extract"
        tar -xzf "$tarball" -C "$extract"
        install -m 0755 "$extract/vl" "{{ vaultlogin_install_dir }}/vl"
        rm -rf "$extract" "$tarball"
      args:
        executable: /bin/bash
      register: vaultlogin_install
      changed_when: true
      when:
        - not (dry_run | default(false) | bool)
        - vaultlogin_install_needed | default(true) | bool

    - name: Verify vl version after install
      ansible.builtin.command:
        argv:
          - "{{ vaultlogin_install_dir }}/vl"
          - --version
      register: vaultlogin_post_install_version
      changed_when: false
      failed_when: >-
        ('v' ~ vaultlogin_version) not in (vaultlogin_post_install_version.stdout | default(''))
      when:
        - not (dry_run | default(false) | bool)
        - vaultlogin_install is defined
        - not (vaultlogin_install.skipped | default(false))

    - name: Check vl token helper configuration
      ansible.builtin.command: cat "{{ ansible_facts['env']['HOME'] }}/.vault"
      register: vaultlogin_token_helper_check
      changed_when: false
      failed_when: false
      when: not (dry_run | default(false) | bool)

    - name: Configure vl as the Vault token helper
      ansible.builtin.command:
        argv:
          - "{{ vaultlogin_install_dir }}/vl"
          - token-helper
          - setup
      changed_when: true
      when:
        - not (dry_run | default(false) | bool)
        - (vaultlogin_install_dir ~ '/vl') not in (vaultlogin_token_helper_check.stdout | default(''))

    - name: Deploy Vault shell functions
      ansible.builtin.template:
        src: vault_functions.zsh.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/workstation-devops/vault_functions.zsh"
        mode: "0644"
      when: not (dry_run | default(false) | bool)

    - name: Show Vault functions deploy (dry-run)
      ansible.builtin.debug:
        msg: >-
          Would deploy ~/.config/workstation-devops/vault_functions.zsh
          (per-cluster vl aliases, vault_mgmt) for work_username={{ work_username }}.
      when: dry_run | default(false) | bool

    - name: Source Vault functions from zshrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        marker: "# {mark} ANSIBLE MANAGED - workstation-devops vault-tools"
        block: "{{ lookup('template', 'vault_tools_zshrc.sh.j2') }}"
        insertafter: EOF
      when: not (dry_run | default(false) | bool)
