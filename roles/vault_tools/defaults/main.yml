---
vault_tools_enabled: true

# vl (adobe-security-tooling/vaultlogin) — OIDC-based Vault CLI, replaces the
# onboarding-wiki Okta shell function. Pin explicitly; bump via PR when the
# team ships a new tag.
vaultlogin_version: "1.1.0"
vaultlogin_github_repo: adobe-security-tooling/vaultlogin
vaultlogin_install_dir: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
