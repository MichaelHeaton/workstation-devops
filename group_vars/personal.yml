---
# Personal machine profile — homelab, gaming, personal repos.

# Default feature tags for personal machines (add work tools: -e 'workstation_tags_extra=[work]').
workstation_tags_profile:
  - home

# Personal AWS / Terraform (platform-bootstrap). Override in personal.local.yml if needed.
personal_aws_profile: platform-bootstrap
personal_aws_region: us-west-2
personal_tf_state_bucket: mccleaton-tfstate

projects_buckets:
  - name: personal
  - name: scratch
  - name: workspace
  - name: work
  - name: specterrealm
  - name: uvcyber
  - name: archive

managed_repos:
  - repo: https://github.com/MichaelHeaton/MichaelHeaton.git
    dest: personal/MichaelHeaton
  - repo: https://github.com/McCleaton/cloudflare.git
    dest: personal/cloudflare
  - repo: https://github.com/MichaelHeaton/platform-bootstrap.git
    dest: personal/platform-bootstrap
  - repo: https://github.com/MichaelHeaton/memex-suite.git
    dest: personal/memex-suite
  - repo: https://github.com/specterrealm-homelab/homelab-observability.git
    dest: specterrealm/homelab/homelab-observability
  - repo: https://github.com/MichaelHeaton/minecraft-modpack-family.git
    dest: specterrealm/esport/minecraft-modpack-family
  - repo: https://github.com/MichaelHeaton/minecraft-modpack-cp-verdant.git
    dest: specterrealm/esport/minecraft-modpack-cp-verdant
  - repo: https://github.com/MichaelHeaton/minecraft-modpack-ltm.git
    dest: specterrealm/esport/minecraft-modpack-ltm
  - repo: https://github.com/SpecterRealm/specterrealm-core.git
    dest: specterrealm/esport/specterrealm-core
  - repo: https://github.com/SpecterRealm/minecraft-modpack-cp-elysian.git
    dest: specterrealm/esport/minecraft-modpack-cp-elysian
  - repo: https://github.com/SpecterRealm/minecraft-modpack-cp-influx.git
    dest: specterrealm/esport/minecraft-modpack-cp-influx
  - repo: https://github.com/SpecterRealm/minecraft-modpack-cp-liminal.git
    dest: specterrealm/esport/minecraft-modpack-cp-liminal

homebrew_install_packages: true
homebrew_mas_enabled: true

homebrew_formulae_profile:
  - mas
  - packer
  - kubernetes-cli
  - minikube
  - consul
  - go

homebrew_go_binaries:
  - module: github.com/packwiz/packwiz@latest
    name: packwiz

homebrew_casks_profile:
  - lens
  - balenaetcher
  - synology-drive
  - steam
  - curseforge
  - prismlauncher
  - microsoft-teams
  - signal
  - sublime-text

homebrew_cask_app_bundles:
  microsoft-teams: Microsoft Teams.app

mac_dmg_apps_profile:
  - ai-spend-tracker
mac_dmg_apps_install: true

homebrew_mas_apps:
  - id: "803453959"
    name: Slack
    bundle: Slack.app
