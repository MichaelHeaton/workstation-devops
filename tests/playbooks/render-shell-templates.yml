---
# Render shell zsh fragments and validate syntax (zsh -n).
# Catches broken exports/functions before make apply touches ~/.zshrc.

- name: Render and validate shell templates
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    workstation_profile: personal
    personal_aws_profile: platform-bootstrap
    personal_aws_region: us-west-2
    personal_tf_state_bucket: test-tfstate-bucket
    workstation_tags:
      - home
      - shell
    work_username: testuser
    brew_prefix: /opt/homebrew
    brew_bin: /opt/homebrew/bin/brew
    ai_skills_accounts_shell: ""
  tasks:
    - name: Render personal shell fragment
      ansible.builtin.template:
        src: ../../roles/shell/templates/shell_personal.zsh.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/.cache/workstation-devops-test-shell-personal.zsh"
        mode: "0644"

    - name: Validate personal shell fragment (zsh -n)
      ansible.builtin.command:
        cmd: zsh -n "{{ ansible_facts['env']['HOME'] }}/.cache/workstation-devops-test-shell-personal.zsh"
      changed_when: false

    - name: Remove test artifact
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.cache/workstation-devops-test-shell-personal.zsh"
        state: absent
